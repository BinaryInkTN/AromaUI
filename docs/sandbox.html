<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Incense Sandbox</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --ide-bg: #1e1e1e;
      --ide-sidebar: #252526;
      --ide-border: #3e3e42;
      --ide-text: #cccccc;
      --ide-text-muted: #858585;
      --ide-accent: #007acc;
      --ide-accent-hover: #0098ff;
      --ide-input-bg: #3c3c3c;
      --ide-hover: #2a2d2e;
      --ide-success: #4ec9b0;
      --ide-error: #f48771;
      --ide-font: 'Inter', 'Segoe UI', system-ui, sans-serif;
      --ide-mono: 'Roboto Mono', 'Consolas', monospace;
    }
    [data-theme="light"] {
      --ide-bg: #ffffff;
      --ide-sidebar: #f3f3f3;
      --ide-border: #e4e4e4;
      --ide-text: #333333;
      --ide-text-muted: #616161;
      --ide-accent: #0064b0;
      --ide-accent-hover: #005a9e;
      --ide-input-bg: #f3f3f3;
      --ide-hover: #e8e8e8;
      --ide-success: #107c41;
      --ide-error: #a1260d;
    }
    .ghost-text { opacity: 0.4; pointer-events: none; }
    [data-theme="light"] .ghost-text { opacity: 0.35; }
    html, body { height: 100%; background: var(--ide-bg); color: var(--ide-text); font-family: var(--ide-font); overflow: hidden; margin: 0; }
    #app { display: flex; flex-direction: column; height: 100%; }
    #toolbar {
      height: 36px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 10px; border-bottom: 1px solid var(--ide-border); background: var(--ide-sidebar); gap: 8px;
    }
    .toolbar-title { font-size: 12px; font-weight: 600; color: var(--ide-text); }
    .toolbar-actions { display: flex; gap: 6px; align-items: center; }
    #runBtn {
      height: 28px; padding: 0 10px; border-radius: 4px; border: none; font-family: var(--ide-font);
      font-size: 12px; font-weight: 500; cursor: pointer; background: var(--ide-accent); color: #fff;
      display: inline-flex; align-items: center; gap: 4px;
    }
    #runBtn:hover { background: var(--ide-accent-hover); }
    #runBtn.pending { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .icon-btn {
      width: 28px; height: 28px; border-radius: 4px; border: none; cursor: pointer;
      background: transparent; color: var(--ide-text-muted); display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { background: var(--ide-hover); color: var(--ide-text); }
    .icon-btn svg { width: 14px; height: 14px; }
    #workspace { display: flex; flex-direction: row; flex: 1; min-height: 0; }
    #editor-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--ide-border); }
    #editor { flex: 1; }
    #preview-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
    #preview-header {
      height: 32px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 10px; border-bottom: 1px solid var(--ide-border); font-size: 11px; color: var(--ide-text-muted);
    }
    #canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; background: #F7F7F7; min-height: 0; padding: 20px; box-sizing: border-box; }
    [data-theme="dark"] #canvas-wrap { background: #111318; }
    #phone-frame { display: inline-block; max-width: 100%; max-height: 100%; border-radius: 24px; box-shadow: 0 0 0 8px #1a1a1a, 0 0 0 10px #333, 0 20px 50px rgba(0,0,0,0.5); overflow: hidden; background: #000; line-height: 0; flex-shrink: 0; }
    #phone-frame canvas { display: block; max-width: 100%; max-height: 100%; touch-action: none; }
    /* Bare embed: docs pages that want the app itself on show, with no IDE
       chrome and no device bezel. The hosting page draws the tablet shadow,
       so the canvas fills the frame edge to edge. The app clears to alpha 0
       (see aroma_ui_set_transparent_background), so the host page shows
       through wherever the app draws nothing. */
    html.bare, html.bare body, html.bare #app, html.bare #workspace,
    html.bare #preview-pane { background: transparent; }
    html.bare #toolbar, html.bare #preview-header, html.bare #status-bar,
    html.bare #editor-pane { display: none; }
    html.bare #preview-pane { border-left: none; }
    html.bare #workspace { display: block; }
    html.bare #canvas-wrap { display: block; background: transparent; padding: 0; overflow: hidden; }
    html.bare #phone-frame { display: block; border-radius: 0; overflow: hidden; box-shadow: none; background: transparent; max-width: none; max-height: none; }
    html.bare #phone-frame canvas { width: 100% !important; height: auto !important; max-width: none !important; max-height: none !important; border-radius: 0; }
    body.embed #editor-pane { display: none; }
    body.embed #preview-pane { border-left: none; }
    #status-bar {
      height: 22px; background: var(--ide-sidebar); border-top: 1px solid var(--ide-border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 11px; gap: 10px;
    }
    .status-left, .status-right { display: flex; align-items: center; gap: 8px; }
    .status-item { display: flex; align-items: center; gap: 6px; color: var(--ide-text-muted); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.ok { background: var(--ide-success); }
    .status-dot.error { background: var(--ide-error); }
    .status-dot.pending { background: currentColor; animation: pulse 1.5s infinite; }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <div class="toolbar-title">Incense Sandbox</div>
      <div class="toolbar-actions">
        <button class="icon-btn" id="themeBtn" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <button id="runBtn" title="Run">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span>Run</span>
        </button>
      </div>
    </div>
    <div id="workspace">
      <div id="editor-pane">
        <div id="editor"></div>
      </div>
      <div id="preview-pane">
        <div id="preview-header">
          <span>Preview</span>
        </div>
        <div id="canvas-wrap">
          <div id="phone-frame">
            <canvas id="canvas" width="320" height="480"></canvas>
          </div>
        </div>
      </div>
    </div>
    <footer id="status-bar">
      <div class="status-left">
        <span class="status-item"><span class="status-dot ok" id="statusDot"></span><span id="statusText">Ready</span></span>
        <span class="status-item" id="errorMsg"></span>
      </div>
      <div class="status-right">
        <span class="status-item">Incense</span>
      </div>
    </footer>
  </div>

      try {
        if (window.parent && window.parent !== window) {
          var pt = window.parent.localStorage.getItem('docs-theme');
          if (pt === 'light' || pt === 'dark') return pt;
        }
      } catch (e) {}
      var st = null;
      try { st = localStorage.getItem('sandbox-theme'); } catch (e) {}
      return (st === 'light' || st === 'dark') ? st : 'light';
    };
    window.applySandboxTheme = function(next) {
      if (next !== 'light' && next !== 'dark') return;
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('sandbox-theme', next); } catch (e) {}
      var icon = document.querySelector('#themeBtn svg');
      if (icon) {

        }

      window.syncPreviewAppTheme();

      } catch (e) {}

      var projName = qs.get('project') || '';
      window.incenseQuery = {

        embed: qs.get('embed') === '1',

    if (window.incenseQuery && window.incenseQuery.bare) {
      // Bare embed: transparent page, no IDE chrome, no device bezel, so an
      // embedding docs page can position the canvas as its own "device".
      document.documentElement.classList.add('bare');
    }
    window.incenseInitialSource = null;
    if (window.incenseQuery.example && window.incenseExamples[window.incenseQuery.example]) {
      window.incenseInitialSource = window.incenseExamples[window.incenseQuery.example];

    // Multi-file project support: ?project=NAME loads projects/NAME/manifest.json,
    // preloads its .aroma files (+ assets) into the sandbox filesystem, resolves
    // `include "path.aroma"` directives into a single source, and runs it.
    window.incenseProject = null;
    window.__projectLoaded = false;
    // ?theme=NAME pins the preview app's own theme so an embed can render a
    // fixed palette (the docs home live demo pins "Material Blue dark")
    // regardless of the page light/dark sync. The pin is re-applied after
    // every runCode()/theme message via aroma_sandbox_set_theme_preset.
    (function() {
      var pin = (window.incenseQuery && window.incenseQuery.theme) || '';
      if (!pin) return;
      window.__pinnedPreviewTheme = pin;
      // The pinned chrome theme: dark pins are rendered on the dark sandbox
      // chrome so a bare embed never shows the host page's light background
      // through the letterbox around the canvas.
      var chromeTheme = /dark/i.test(pin) ? 'dark' : 'light';
      window.__pinnedChromeTheme = chromeTheme;
      window.syncPreviewAppTheme = function() {
        try {
          if (window.__aromaReady && window.Module && typeof window.Module.ccall === 'function') {
            window.Module.ccall('aroma_sandbox_set_theme_preset', null, ['string'], [pin]);

      // pin one. Re-assert the pinned chrome theme after every message and
      // after any direct data-theme write the same-origin host page makes.

        document.documentElement.setAttribute('data-theme', chromeTheme);
        window.syncPreviewAppTheme();
      };

        // data-theme directly, bypassing applySandboxTheme. Watch for that and
        // snap it back to the pinned chrome theme.
        var lockChromeTheme = function() {

  <script>
    window.setStatus = function(type, msg) {
      var statusDot = document.getElementById('statusDot');
      var statusText = document.getElementById('statusText');
      var errorMsg = document.getElementById('errorMsg');
      if (statusText) statusText.textContent = msg || 'Ready';
      if (statusDot) statusDot.className = 'status-dot ' + type;
      if (errorMsg) errorMsg.textContent = type === 'error' ? msg : '';
    };

    function runCode() {
      var source = window.incenseEditor ? window.incenseEditor.getValue() : '';
      try {
        Module.ccall('aroma_sandbox_reload', null, ['string'], [source]);
        if (Module.ccall('aroma_sandbox_has_error', 'number', [], [])) {
          setStatus('error', Module.ccall('aroma_sandbox_get_last_error', 'string', [], []));
        } else {
          setStatus('ok', 'Ready');
          document.getElementById('runBtn').classList.remove('pending');
        }
        if (typeof window.syncPreviewAppTheme === 'function') window.syncPreviewAppTheme();
      } catch (e) {
        console.error('[sandbox] Runtime error:', e);
        if (typeof e === 'object' && e.stack) console.error('[sandbox] Stack:', e.stack);
        setStatus('error', 'Runtime error: ' + (e.message || String(e)));
      }
    }
    window.runCode = runCode;

    /* ----- Multi-file project support -----
     *
     * ?project=NAME loads projects/NAME/manifest.json:
     *   {
     *     "name": "My App",
     *     "main": "main.aroma",
     *     "files": [
     *       {"path": "partials/header.aroma"},
     *       {"path": "assets/logo.png", "type": "asset"}
     *     ],
     *     "assets": ["assets/hero.jpg"]   // shorthand for {path, type:'asset'}
     *   }
     *
     * Each file is fetched and written to the Emscripten virtual filesystem
     * (/project/<path> for .aroma, /assets/<path> for assets), matching where
     * the curated demos' preloaded assets live.  The main file (and any files
     * it `include`s) are resolved into a single source string and handed to
     * aroma_sandbox_reload, so the wasm runtime needs no changes.
     *
     * Incense include syntax (top level):
     *   include "partials/header.aroma"
     * Paths resolve relative to the including file's directory. Cycles are
     * guarded.
     */

    function fsEnsureDir(fsPath) {
      var parts = fsPath.split('/');
      var p = '';
      for (var i = 0; i < parts.length; i++) {
        if (!parts[i]) continue;
        p += '/' + parts[i];
        try { Module.FS.mkdir(p); } catch (e) {}
      }
    }

    function fsResolvePath(dir, rel) {
      var parts = (dir + '/' + rel).split('/');
      var out = [];
      for (var i = 0; i < parts.length; i++) {
        var part = parts[i];
        if (!part || part === '.') continue;
        if (part === '..') { if (out.length) out.pop(); continue; }
        out.push(part);
      }
      return out.join('/') || '/';
    }

    function resolveIncludes(text, fileDir, seen) {
      var re = /^\s*include\s+"([^"]+)"\s*$/gm;
      var result = '', lastIndex = 0, m;
      while ((m = re.exec(text)) !== null) {
        result += text.slice(lastIndex, m.index);
        var incPath = m[1];
        var resolved = fsResolvePath(fileDir, incPath);
        if (seen.has(resolved)) {
          result += '// ERROR: Circular include: ' + incPath + '\n';
        } else {
          seen.add(resolved);
          var incSrc;
          try {
            incSrc = new TextDecoder().decode(Module.FS.readFile(resolved));
          } catch (e) {
            incSrc = '// ERROR: Failed to include: ' + incPath + '\n';
          }
          var incDir = resolved.substring(0, resolved.lastIndexOf('/'));
          result += resolveIncludes(incSrc, incDir, seen);
          seen.delete(resolved);
        }
        lastIndex = re.lastIndex;
      }
      result += text.slice(lastIndex);
      return result;
    }

    window.loadIncenseProject = async function(name) {
      var base = 'projects/' + name + '/';
      var manifest;
      try {
        var mr = await fetch(base + 'manifest.json');
        if (!mr.ok) throw new Error('manifest not found: ' + mr.status);
        manifest = await mr.json();
      } catch (e) {
        console.error('[sandbox] Project manifest load failed:', e);
        setStatus('error', 'Project manifest load failed: ' + (e.message || String(e)));
        window.__projectLoaded = true;
        return;
      }
      var files = manifest.files || [];
      // Normalize shorthand asset strings.
      var allFiles = [];
      for (var i = 0; i < files.length; i++) {
        var f = files[i];
        if (typeof f === 'string') allFiles.push({ path: f, type: 'asset' });
        else allFiles.push(f);
      }
      // Also honor a top-level assets[] shorthand.
      var assets = manifest.assets || [];
      for (var i = 0; i < assets.length; i++)
        allFiles.push({ path: assets[i], type: 'asset' });
      // Preload every file into the Emscripten virtual filesystem.
      for (var i = 0; i < allFiles.length; i++) {
        var f = allFiles[i];
        try {
          var resp = await fetch(base + f.path);
          if (!resp.ok) throw new Error('fetch ' + f.path + ': ' + resp.status);
          var ab = await resp.arrayBuffer();
          var bytes = new Uint8Array(ab);
          var isAsset = (f.type === 'asset') || /\.(png|jpg|jpeg|gif|webp|bmp|ttf|otf|woff|woff2|mpg|mp4|wav)$/i.test(f.path);
          var fsPath = (isAsset ? '/assets/' : '/project/') + f.path;
          fsEnsureDir(fsPath);
          Module.FS.writeFile(fsPath, bytes, { encoding: 'binary' });
        } catch (e) {
          console.error('[sandbox] Failed to preload ' + f.path + ':', e);
          setStatus('error', 'Failed to preload ' + f.path + ': ' + (e.message || String(e)));
          window.__projectLoaded = true;
          return;
        }
      }
      // Read the main file and resolve includes into one source string.
      var mainPath = manifest.main || 'main.aroma';
      var combined;
      try {
        var mainBytes = Module.FS.readFile('/project/' + mainPath);
        var mainSrc = new TextDecoder().decode(mainBytes);
        combined = resolveIncludes(mainSrc, '/project', new Set());
      } catch (e) {
        console.error('[sandbox] Failed to read main file:', e);
        setStatus('error', 'Failed to read main file: ' + (e.message || String(e)));
        window.__projectLoaded = true;
        return;
      }
      window.incenseInitialSource = combined;
      if (window.incenseEditor && typeof window.incenseEditor.setValue === 'function')
        window.incenseEditor.setValue(combined);
      window.__projectLoaded = true;
      setStatus('ok', 'Ready');
    };

        provideCompletionItems: function(model, position) {
          var ctx = getWidgetContext(model, position.lineNumber - 1);
          var suggestions = [];
          var word = model.getWordUntilPosition(position);
          var range = { startLineNumber: position.lineNumber, endLineNumber: position.lineNumber, startColumn: word.startColumn, endColumn: word.endColumn };

          if (ctx.length === 0) {
            var widgetNames = Object.keys(WIDGET_SNIPPETS);
            suggestions = suggestions.concat(
              widgetNames.map(function(w) {
                return { label: w, kind: monaco.languages.CompletionItemKind.Class, insertText: WIDGET_SNIPPETS[w], insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet, range: range };
              })
            );
          } else {
            var currentWidget = ctx[ctx.length - 1];
            var props = WIDGET_PROPS[currentWidget] || [];
            suggestions = suggestions.concat(
              props.map(function(p) {
                return { label: p, kind: monaco.languages.CompletionItemKind.Property, insertText: p + ': $0', insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet, range: range };
              })
            );
            suggestions.push({ label: 'true', kind: monaco.languages.CompletionItemKind.Value, insertText: 'true', range: range });
            suggestions.push({ label: 'false', kind: monaco.languages.CompletionItemKind.Value, insertText: 'false', range: range });
            var children = WIDGET_CHILDREN[currentWidget];
            if (children && children.length) {
              suggestions = suggestions.concat(

                })
              );
            }
          }

          return { suggestions: suggestions };
        }
