<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smartwatch Example</title>
  <style>
    html, body { height: 100%; margin: 0; background: #1e1e1e; color: #cccccc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #app { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    canvas { display: block; background: #111318; }
    #status { padding: 8px 12px; font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="canvas" width="380" height="380"></canvas>
    <div id="status">Smartwatch Example</div>
  </div>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      print: function (text) { console.log(text); },
      printErr: function (text) { console.error(text); },
      onRuntimeInitialized: function () {
        var statusEl = document.getElementById('status');
        statusEl.textContent = 'Running';
      }
    };
  </script>
  <script src="smartwatch_example.js"></script>
</body>
</html>
