<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Incense IDE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="ide.css" rel="stylesheet">
  <link href="dropdown.css" rel="stylesheet">
</head>
<body>
  <!-- Home Screen -->
  <div id="home-screen">
    <div class="home-card">
      <div class="home-title">Incense IDE</div>
      
      <div class="form-group">
        <label>Recent Projects</label>
        <div class="home-list" id="home-projects-list">
          <div class="home-item">Loading...</div>
        </div>
      </div>
      
      <hr style="border:0; border-top:1px solid var(--ide-border); margin: 10px 0;">
      
      <div class="form-group">
        <label>Create New Project</label>
        <div style="display:flex; gap:10px;">
          <input type="text" id="newProjName" placeholder="Project name (e.g. myapp)" style="flex:1" />
          <button class="btn primary" onclick="window.createNewProject()">Create</button>
        </div>
      </div>
    </div>
  </div>

  <div id="app">
    <!-- Menu Bar -->
    <div id="menubar">
      <div class="menu-item" onclick="window.showHomeScreen()">Home</div>
      <div class="menu-item">File
        <div class="dropdown-content">
          <a onclick="window.saveState()">Save All</a>
          <a onclick="window.showHomeScreen()">Close Project</a>
        </div>
      </div>
      <div class="menu-item">Project
        <div class="dropdown-content">
          <a onclick="document.getElementById('runBtn').click()">Run Preview (Web)</a>
          <a onclick="document.getElementById('runNativeBtn').click()">Run Native (Local)</a>
        </div>
      </div>
      <div class="menu-item">Help
        <div class="dropdown-content">
          <a onclick="alert('Incense IDE Sandbox - Powered by AromaUI')">About</a>
        </div>
      </div>
    </div>

    <!-- Tool Bar -->
    <div id="toolbar">
      <button class="icon-btn" id="themeBtn" title="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
      <button class="icon-btn" title="Save" onclick="window.saveState && window.saveState()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
      </button>
      <div style="width: 10px;"></div>
      <button class="action-btn" id="buildBtn" title="Simulate Build for Preview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
        <span>Preview Build</span>
      </button>
      <button class="action-btn primary" id="runBtn" title="Hot reload Preview Canvas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span>Run Preview</span>
      </button>
      
      <div style="width: 20px;"></div>
      
      <select id="nativeTarget" style="background: var(--ide-input-bg); border: 1px solid var(--ide-border); color: var(--ide-text); padding: 4px; border-radius: 4px;">
        <option value="linux">Linux</option>
        <option value="android">Android</option>
      </select>
      <button class="action-btn" id="runNativeBtn" title="Compile and Run Natively">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
        <span>Run Native</span>
      </button>
    </div>

    <!-- Main Workspace -->
    <div id="main-layout">
      
      <!-- Project Explorer -->
      <div id="sidebar-left">
        <div class="panel-header">Project Explorer</div>
        <div class="panel-content" id="file-tree">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Editor Area -->
      <div id="center-area">
        <div id="editor-tabs">
          <!-- Populated by JS -->
        </div>
        <div id="editor-container">
          <div id="editor"></div>
        </div>
        
        <!-- Bottom Panel -->
        <div id="bottom-panel">
          <div id="bottom-tabs">
            <div class="bottom-tab active">Console</div>
            <div class="bottom-tab">Problems</div>
            <div class="bottom-tab">Terminal</div>
          </div>
          <div id="console-output"></div>
        </div>
      </div>

      <!-- Preview Panel -->
      <div id="preview-panel">
        <div class="preview-toolbar">
          <span>Preview</span>
          <span>Emscripten WebGL</span>
        </div>
        <div id="canvas-wrap">
          <div id="phone-frame">
            <canvas id="canvas" width="320" height="480"></canvas>
            <div class="resize-handle" id="resizeHandle"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Status Bar -->
    <footer id="status-bar">
      <div class="status-left">
        <span id="status-msg">Ready</span>
        <span id="current-project" style="opacity:0.7;">No Project</span>
      </div>
      <div class="status-right">
        <span>Incense IDE</span>
        <span>UTF-8</span>
      </div>
    </footer>
  </div>

  <!-- Scripts -->
  <script>
    window.Module = window.Module || {};
    Module.onRuntimeInitialized = function() {
      var c = Module.canvas;
      if (c) {
        c.tabIndex = -1;
        c.onkeydown = null;
        c.onkeypress = null;
        c.onkeyup = null;
        Module.keyboardInput = null;
      }
    };
  </script>
  <script src="incense_sandbox.js"></script>
  <script src="ide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.min.js"></script>
  <script>
    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }});
    require(['vs/editor/editor.main'], function() {
      monaco.editor.defineTheme('incense-light', {
        base: 'vs',
        inherit: true,
        rules: [
          { token: 'keyword', foreground: '02569B', fontStyle: 'bold' },
          { token: 'type', foreground: '0175C2' },
          { token: 'string', foreground: 'C41A16' },
          { token: 'number', foreground: '1C01CE' },
          { token: 'comment', foreground: '177500' },
          { token: 'delimiter', foreground: 'A90D91' }
        ],
        colors: { 'editor.background': '#FFFFFF', 'editor.foreground': '#202124' }
      });
      monaco.editor.defineTheme('incense-dark', {
        base: 'vs-dark',
        inherit: true,
        rules: [
          { token: 'keyword', foreground: 'C586C0', fontStyle: 'bold' },
          { token: 'type', foreground: '4EC9B0' },
          { token: 'string', foreground: 'CE9178' },
          { token: 'number', foreground: 'B5CEA8' },
          { token: 'comment', foreground: '6A9955' },
          { token: 'delimiter', foreground: 'D4D4D4' }
        ],
        colors: { 'editor.background': '#1E1E1E', 'editor.foreground': '#D4D4D4' }
      });

      monaco.languages.register({ id: 'incense' });
      monaco.languages.setMonarchTokensProvider('incense', {
        keywords: [
          'Window','Container','Button','Label','Checkbox','Switch','Slider','Textbox','ProgressBar',
          'Divider','Card','IconButton','Icon','Image','Dropdown','RadioButton','Tabs','Sidebar',
          'Menu','Chip','Tooltip','GIF','Loading','Gauge','Canvas','DebugOverlay','Map','ThreeDViewer',
          'Snackbar','ListView','Dialog','ScrollView','Table','Column','Row','Tab','Item','MenuItem','ListItem','Header','Separator',
          'Option','HeaderCell'
        ],
        properties: [
          'x','y','width','height','text','title','message','placeholder','value','min','max',
          'style','layout','direction','orientation','type','variant','checked','selected',
          'src','lat','lon','zoom','radius','thickness','color','action','duration','z_index',
          'autoplay','interactive','auto_rotate','secondary'
        ],
        enums: [
          'large','medium','small','flex','row','column','horizontal','vertical','elevated',
          'filled','outlined','standard','assist','filter','suggestion','top','bottom','left','right',
          'basic','fullscreen','determinate','indeterminate'
        ],
        tokenizer: {
          root: [
            [/\{/, 'delimiter.curly'],
            [/\}/, 'delimiter.curly'],
            [/:/, 'delimiter.colon'],
            [/,/, 'delimiter.comma'],
            [/#[0-9a-fA-F]+/, 'color'],
            [/\d+\.?\d*/, 'number'],
            [/"([^"\\]|\\.)*$/, 'string.invalid'],
            [/"/, 'string', '@string'],
            [/\b(true|false)\b/, 'boolean'],
            [/\/\/.*$/, 'comment'],
            [/[a-zA-Z_]\w*/, {
              cases: {
                '@keywords': 'keyword',
                '@properties': 'property',
                '@enums': 'enum',
                '@default': 'identifier'
              }
            }]
          ],
          string: [
            [/[^"]+/, 'string'],
            [/"/, 'string', '@pop']
          ]
        }
      });

      var editor = monaco.editor.create(document.getElementById('editor'), {
        value: "",
        language: 'incense',
        theme: 'incense-dark',
        automaticLayout: true,
        minimap: { enabled: true },
        fontSize: 14,
        fontFamily: 'Roboto Mono, Consolas, monospace',
        lineNumbers: 'on',
        scrollBeyondLastLine: false,
        wordWrap: 'on'
      });
      
      // Initialize IDE Logic
      if (window.initIDE) {
        window.initIDE(editor);
      }
    });
  </script>
</body>
</html>
